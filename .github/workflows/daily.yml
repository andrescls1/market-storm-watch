name: Daily model run

on:
  schedule:
    # 11:17 UTC on weekdays (after US data releases settle overnight)
    - cron: "17 11 * * 1-5"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional; public CSV used if empty
        run: python fetch_data.py

      - name: Run model and update dashboard data
        run: python daily_run.py

      - name: Commit results
        run: |
          git config user.name "storm-watch-bot"
          git config user.email "storm-watch-bot@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily run $(date -u +%Y-%m-%d)"
            git push
          fi
