name: Daily model run

on:
  schedule:
    # 11:17 UTC on weekdays (after US data releases settle overnight)
    - cron: "17 11 * * 1-5"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data
        timeout-minutes: 8
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY || vars.FRED_API_KEY }}   # secret preferred; variable accepted as fallback
        run: |
          mkdir -p logs
          set -o pipefail
          python -u fetch_data.py 2>&1 | tee logs/fetch.log

      - name: Run model and update dashboard data
        id: model
        timeout-minutes: 8
        run: |
          set -o pipefail
          python -u daily_run.py 2>&1 | grep -v "Warning" | tee logs/model.log

      - name: Commit results
        if: always()     # save logs and data even when the model step fails
        run: |
          git config user.name "storm-watch-bot"
          git config user.email "storm-watch-bot@users.noreply.github.com"
          if [ "${{ steps.model.outcome }}" != "success" ]; then
            # keep yesterday's dashboard; save the inputs and logs for diagnosis
            git checkout -- docs/data 2>/dev/null || true
            MSG="Daily run $(date -u +%Y-%m-%d) (model step FAILED, see logs/)"
          else
            MSG="Daily run $(date -u +%Y-%m-%d)"
          fi
          git add data docs/data logs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "$MSG"
            git push
          fi
          [ "${{ steps.model.outcome }}" = "success" ]
